# 网页终端背后的 tmux（单独的套接字：tmux -L web）。每个网页上的“窗口”是这里的一个会话，里面只有一个窗格。
# 改了之后：tmux -L roundtable source-file <这个文件>

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g exit-empty off              # 一个窗口都没有时服务也不退出
set -g status off                  # 窗口列表在网页上，不要底下那条状态栏
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g window-size latest          # 几个浏览器同时看同一个窗口：尺寸跟最后操作的那个
setw -g aggressive-resize on
set -g mouse on                    # 滚轮翻历史、拖选复制
set -g set-clipboard on            # 复制的内容送到浏览器的剪贴板（OSC 52）
setw -g mode-keys vi
set -g renumber-windows on
set -g display-time 1500

# 拖选松开就复制，并退出复制模式（默认行为，写明白）
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
